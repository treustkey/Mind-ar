<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindAR — Ложка на маркере</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      text-align: center;
      z-index: 999;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #overlay.hidden { opacity: 0; }
  </style>
</head>
<body>

  <div id="overlay">Наведите камеру на изображение-маркер</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
      filterMinCF: 0.001;
      filterBeta: 10000;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="2 4 3"></a-light>
    <a-light type="point" color="#ffeedd" intensity="0.5" position="-1 2 1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity position="0 0 0" rotation="-90 0 0">

        <a-cylinder
          color="#c0c0c0"
          radius="0.02"
          height="0.6"
          position="0 0.3 0"
          material="metalness: 0.9; roughness: 0.2"
        ></a-cylinder>

        <a-sphere
          color="#d0d0d0"
          radius="0.08"
          scale="1 1.4 0.3"
          position="0 0 0"
          material="metalness: 0.9; roughness: 0.2"
        ></a-sphere>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('overlay');
      const target  = document.querySelector('[mindar-image-target]');

      if (target) {
        target.addEventListener('targetFound', () => overlay.classList.add('hidden'));
        target.addEventListener('targetLost',  () => overlay.classList.remove('hidden'));
      }
    });
  </script>

</body>
</html>
